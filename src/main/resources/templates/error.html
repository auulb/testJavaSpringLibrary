<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('出错了')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container narrow">
    <div class="card error-card">
        <h1>
            <span th:text="${status} ?: '出错了'">500</span>
            <span th:text="${error} ?: '请求处理失败'">错误</span>
        </h1>
        <p class="muted" th:if="${message}" th:text="${message}"></p>
        <p class="muted">您可以返回首页继续操作。</p>
        <a class="btn btn-primary" th:href="@{/}">返回首页</a>
    </div>
</main>

</body>
</html>
